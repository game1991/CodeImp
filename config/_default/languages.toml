# Rename this file to languages.toml to enable multilingual support

[zh-cn]
    languageName     ="简体中文"
    languagedirection="ltr"
    #timeZone         ="Asia/Shanghai"
    title ="代码无界限"
    weight=1
    [zh-cn.params.sidebar]
        subtitle="心之所向，皆是可能"
    [zh-cn.params.article.license]
        default="开源协议=>[CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"
        enabled=true
    [zh-cn.params.dateFormat]
        lastUpdated="2006-01-02 15:04:05"
        published  ="2006-01-02"
    [zh-cn.params]
        heatmapTitle="日产三万亩"

    # 菜单
    [zh-cn.menu]
        [[zh-cn.menu.main]]
            identifier="projects"
            name      ="项目"
            url       ="/projects/"
            weight    =2
            [zh-cn.menu.main.params]
                icon  ="brand-notion" # 项目工程图标
                newtab=false


[en]
    languageName     ="English"
    languagedirection="ltr"
    #timeZone         ="UTC"
    title ="CodeImp"
    weight=2
    [en.params.sidebar]
        subtitle="Where the heart yearns, possibilities unfurl."
    [en.params.article.license]
        default="Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"
        enabled=true
    [en.params.dateFormat]
        lastUpdated="Jan 02, 2006 15:04:05"
        published  ="Jan 02, 2006"
    [en.params]
        heatmapTitle="Daily production of 3,000 hectares"

    # 菜单翻译
    [en.menu]
        [[en.menu.main]]
            identifier="projects"
            name      ="Projects"
            url       ="/en/projects/"
            weight    =2
            [en.menu.main.params]
                icon  ="brand-notion"
                newtab=false
