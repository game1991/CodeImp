<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@3.1.1/lib/misans-400-regular.min.css" />

<!-- 进度条加载 -->
<script src="https://npm.elemecdn.com/nprogress@0.2.0/nprogress.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://npm.elemecdn.com/nprogress@0.2.0/nprogress.css" crossorigin="anonymous" />
<script>
    NProgress.start();
    document.addEventListener("readystatechange", () => {
        if (document.readyState === "interactive") NProgress.inc(0.8);
        if (document.readyState === "complete") NProgress.done();
    });
</script>

<!-- 首页欢迎字幅 -->
<div class="welcome">
    <p style="font-size: 2rem; text-align: center; font-weight: bold">
        <span class="shake" data-text="👋">👋</span>
        <span class="jump-text1 text-3d" data-text="Welcome" style="color: var(--welcome-color1)">Welcome</span>
        <span class="jump-text2 text-3d" data-text="To" style="color: var(--welcome-color2)">To</span>
        <span class="jump-text3 text-3d" data-text="Co" style="color: var(--welcome-color3)">Co</span><span class="jump-text4 text-3d" data-text="d" style="color: var(--welcome-color4)">d</span><span class="jump-text5 text-3d" data-text="e" style="color: var(--welcome-color5)">e</span><span class="jump-text6 text-3d" data-text="I" style="color: var(--welcome-color6)">I</span><span class="jump-text7 text-3d" data-text="m" style="color: var(--welcome-color7)">m</span><span class="jump-text8 text-3d" data-text="p" style="color: var(--welcome-color8)">p</span>
        <span class="jump-text9 text-3d" data-text="Space" style="color: var(--welcome-color8)">Space</span>
    </p>
</div>

<!--增加阅读进度条-->
{{ if and (eq .Type "post") (gt (len (findRE `/\d{4}/` .RelPermalink)) 0) }}
<div class="top-scroll-bar"></div>
<style>
    .top-scroll-bar {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        width: 0;
        height: 3px;
        background: #ef3982;
        transition: width 0.2s ease;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const scrollBar = document.querySelector('.top-scroll-bar');

        function updateScrollBar() {
            const docHeight = Math.max(
                document.body.scrollHeight,
                document.body.offsetHeight,
                document.documentElement.clientHeight,
                document.documentElement.scrollHeight,
                document.documentElement.offsetHeight
            );

            const scrollTop = window.pageYOffset ||
                             document.documentElement.scrollTop ||
                             document.body.scrollTop;

            const scrollableHeight = docHeight - window.innerHeight;

            const scrollProgress = scrollableHeight > 0
                ? (scrollTop / scrollableHeight) * 100
                : 0;

            if (scrollBar) {
                scrollBar.style.width = `${scrollProgress}%`;
            }
        }

        window.addEventListener('scroll', updateScrollBar);
        window.addEventListener('resize', updateScrollBar);

        updateScrollBar();
    });
</script>
{{ end }}
