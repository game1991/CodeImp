<!--返回顶部按钮 -->
<div id="scroll-to-top" style="display: none;">
    <img src="/rocket-icon.png" alt="回到顶部" id="rocket-icon">
    <div id="rocket-fire"></div>
</div>

<!--加载进度条-->
<script src="https://npm.elemecdn.com/nprogress@0.2.0/nprogress.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://npm.elemecdn.com/nprogress@0.2.0/nprogress.css" crossorigin="anonymous" />

<script>
    NProgress.configure({
        showSpinner: false,    // 不显示加载动画
        trickleSpeed: 100,     // 进度条增长速度
        minimum: 0.3,          // 最小显示进度
        speed: 500            // 动画速度
    });
    NProgress.start();
    window.addEventListener('load', function () {
        NProgress.done();
    });
</script>

<!--只在需要时加载 mermaid-->
{{ if .Page.Store.Get "hasMermaid" }}
<!--Mermaid支持-->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        mermaid.initialize({
            startOnLoad: true,
            theme: document.documentElement.getAttribute('data-scheme') === 'dark' ? 'dark' : 'default',
            flowchart: {
                useMaxWidth: true,
                htmlLabels: true,
                curve: 'basis'
            },
            sequence: {
                useMaxWidth: true,
                showSequenceNumbers: true
            }
        });
    });
</script>
{{ end }}

<!-- Fancybox 图片灯箱 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0.23/dist/fancybox/fancybox.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0.23/dist/fancybox/fancybox.umd.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        Fancybox.bind('[data-fancybox="gallery"]', {
            // 配置选项
            animated: true,
            showClass: "fancybox-zoomInUp",
            hideClass: "fancybox-zoomOutDown",
            dragToClose: true,
            placeFocusBack: false,

            // 自定义工具栏
            Toolbar: {
                display: {
                    left: ["prev", "next"],
                    middle: ["zoomIn", "zoomOut", "toggle1to1", "rotateCCW", "rotateCW"],
                    right: ["close"]
                }
            },

            // 缩放和拖拽
            Panzoom: {
                maxScale: 3,
                minScale: 0.5,
                friction: 0.6,
                decelFriction: 0.88
            }
        });
    });
</script>

<style>
/* Fancybox 自定义样式 */
.fancybox-container {
    z-index: 9999;
}

.fancybox-slide {
    background: rgba(0, 0, 0, 0.9);
}

.fancybox-button.is-close {
    background: rgba(255, 255, 255, 0.1);
    color: white;
}

/* 图片悬停效果 */
.post-img-view img {
    transition: transform 0.3s ease;
    cursor: zoom-in;
}

.post-img-view img:hover {
    transform: scale(1.02);
}
</style>
