<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 主背景 -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- 代码背景纹理 -->
  <g opacity="0.1" font-family="monospace" font-size="14" fill="url(#codeGradient)">
    <text x="50" y="50">// Hugo Image Rendering Fix</text>
    <text x="200" y="80">{{ $pageResource := .Resources.GetMatch }}</text>
    <text x="100" y="120">// Multilingual Support</text>
    <text x="300" y="150">{{ if eq .Site.Language.Lang "zh-cn" }}</text>
    <text x="80" y="200">// Project Showcase Upgrade</text>
    <text x="250" y="230">.project-card { transform: translateY(-10px); }</text>
    <text x="150" y="280">// Release Notes v2025.09.17</text>
    <text x="50" y="350">✨ New Features ✨</text>
    <text x="400" y="380">🐛 Bug Fixes 🐛</text>
    <text x="200" y="420">🔧 Optimizations 🔧</text>
    <text x="100" y="480">🎯 Technical Highlights 🎯</text>
    <text x="300" y="520">const result = { success: true, improved: true };</text>
    <text x="150" y="580">console.log('🚀 Deployment Successful!');</text>
  </g>

  <!-- 主要标题区域 -->
  <g filter="url(#glow)">
    <!-- 主标题 -->
    <text x="600" y="200" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white">
      发布日志
    </text>

    <text x="600" y="250" font-family="Arial, sans-serif" font-size="42" font-weight="bold" text-anchor="middle" fill="white">
      Release Notes
    </text>

    <!-- 版本号 -->
    <text x="600" y="320" font-family="monospace" font-size="36" font-weight="600" text-anchor="middle" fill="#ffd700">
      v2025.09.17
    </text>
  </g>

  <!-- 装饰性元素 -->
  <!-- 左上角装饰 -->
  <circle cx="100" cy="100" r="30" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2">
    <animate attributeName="r" values="30;35;30" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 右上角装饰 -->
  <polygon points="1100,50 1150,100 1100,150 1050,100" fill="rgba(255,255,255,0.1)">
    <animateTransform attributeName="transform" type="rotate" values="0 1100 100;360 1100 100" dur="20s" repeatCount="indefinite"/>
  </polygon>

  <!-- 底部装饰线条 -->
  <line x1="200" y1="550" x2="1000" y2="550" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>

  <!-- 底部技术图标 -->
  <g fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="24">
    <text x="300" y="590" text-anchor="middle">🚀</text>
    <text x="450" y="590" text-anchor="middle">⚡</text>
    <text x="600" y="590" text-anchor="middle">🔧</text>
    <text x="750" y="590" text-anchor="middle">✨</text>
    <text x="900" y="590" text-anchor="middle">🎯</text>
  </g>

  <!-- 渐变装饰条 -->
  <rect x="0" y="500" width="1200" height="30" fill="rgba(255,255,255,0.1)"/>

</svg>